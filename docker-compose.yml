version: '3.8'

services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Ці змінні потрібні ПІД ЧАС збірки (Next.js вшиває їх у фронтенд)
        NEXT_PUBLIC_SUPABASE_URL: '${NEXT_PUBLIC_SUPABASE_URL}'
        NEXT_PUBLIC_SUPABASE_ANON_KEY: '${NEXT_PUBLIC_SUPABASE_ANON_KEY}'
        NEXT_PUBLIC_MAINTENANCE_MODE: '${NEXT_PUBLIC_MAINTENANCE_MODE:-false}'
        NEXT_PUBLIC_DEFAULT_LOCALE: '${NEXT_PUBLIC_DEFAULT_LOCALE:-uk}'
        NEXT_PUBLIC_APP_URL: '${NEXT_PUBLIC_APP_URL}'
        NEXT_PUBLIC_FACEBOOK_PIXEL_ID: '${NEXT_PUBLIC_FACEBOOK_PIXEL_ID}'
    
    restart: unless-stopped
    
    # ПОРТИ: Видалено '8090:3000'. Coolify сам знайде порт 3000 всередині мережі Docker.
    
    environment:
      # База даних (Postgres)
      - 'POSTGRES_URL=${POSTGRES_URL}'
      - 'POSTGRES_PRISMA_URL=${POSTGRES_PRISMA_URL}'
      - 'POSTGRES_URL_NON_POOLING=${POSTGRES_URL_NON_POOLING}'
      - 'POSTGRES_USER=${POSTGRES_USER}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
      - 'POSTGRES_DATABASE=${POSTGRES_DATABASE}'
      - 'POSTGRES_HOST=${POSTGRES_HOST}'
      
      # Supabase
      - 'SUPABASE_URL=${SUPABASE_URL}'
      - 'NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}'
      - 'SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}'
      - 'NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}'
      - 'SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}'
      - 'SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}'
      
      # Remonline
      - 'REMONLINE_API_TOKEN=${REMONLINE_API_TOKEN}'
      - 'REMONLINE_API_KEY=${REMONLINE_API_KEY}'
      - 'REMONLINE_WEBHOOK_SECRET=${REMONLINE_WEBHOOK_SECRET}'
      - 'REMONLINE_ORDER_WEBHOOK_SECRET=${REMONLINE_ORDER_WEBHOOK_SECRET}'
      - 'REMONLINE_DELETE_ACCOUNT_WEBHOOK_SECRET=${REMONLINE_DELETE_ACCOUNT_WEBHOOK_SECRET}'
      
      # Email
      - 'EMAIL_SERVER_HOST=${EMAIL_SERVER_HOST}'
      - 'EMAIL_SERVER_PORT=${EMAIL_SERVER_PORT}'
      - 'EMAIL_SERVER_SECURE=${EMAIL_SERVER_SECURE}'
      - 'EMAIL_SERVER_USER=${EMAIL_SERVER_USER}'
      - 'EMAIL_SERVER_PASSWORD=${EMAIL_SERVER_PASSWORD}'
      - 'EMAIL_FROM=${EMAIL_FROM}'
      - 'NOTIFICATION_EMAIL=${NOTIFICATION_EMAIL}'
      
      # App Settings
      - 'NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}'
      - 'NEXT_PUBLIC_MAINTENANCE_MODE=${NEXT_PUBLIC_MAINTENANCE_MODE:-false}'
      - 'NEXT_PUBLIC_DEFAULT_LOCALE=${NEXT_PUBLIC_DEFAULT_LOCALE:-uk}'
      - 'NEXTAUTH_SECRET=${NEXTAUTH_SECRET}'
      
      # Analytics
      - 'GOOGLE_ANALYTICS_PROPERTY_ID=${GOOGLE_ANALYTICS_PROPERTY_ID}'
      - 'GOOGLE_ANALYTICS_PRIVATE_KEY=${GOOGLE_ANALYTICS_PRIVATE_KEY}'
      - 'GOOGLE_ANALYTICS_CLIENT_EMAIL=${GOOGLE_ANALYTICS_CLIENT_EMAIL}'
      - 'NEXT_PUBLIC_FACEBOOK_PIXEL_ID=${NEXT_PUBLIC_FACEBOOK_PIXEL_ID}'

      # Google Business Profile reviews
      - 'GOOGLE_BUSINESS_PROFILE_CLIENT_ID=${GOOGLE_BUSINESS_PROFILE_CLIENT_ID}'
      - 'GOOGLE_BUSINESS_PROFILE_CLIENT_SECRET=${GOOGLE_BUSINESS_PROFILE_CLIENT_SECRET}'
      - 'GOOGLE_BUSINESS_PROFILE_REFRESH_TOKEN=${GOOGLE_BUSINESS_PROFILE_REFRESH_TOKEN}'
      - 'GOOGLE_BUSINESS_PROFILE_ACCOUNT_ID=${GOOGLE_BUSINESS_PROFILE_ACCOUNT_ID}'
      - 'GOOGLE_BUSINESS_PROFILE_LOCATION_ID=${GOOGLE_BUSINESS_PROFILE_LOCATION_ID}'
      - 'GOOGLE_BUSINESS_PROFILE_LOCATION_NAME=${GOOGLE_BUSINESS_PROFILE_LOCATION_NAME}'
      - 'DEBUG_GOOGLE_REVIEWS=${DEBUG_GOOGLE_REVIEWS:-false}'
      
      # Telegram Bot
      - 'TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}'
      - 'TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}'

    # Healthcheck: Допомагає Coolify зрозуміти, коли перемикати трафік на новий контейнер
    # Сам блок раніше загубився — лишався тільки цей коментар, тому контейнер
    # не повідомляв про свій стан і Coolify міг вважати здоровим процес, який
    # уже не обслуговує запити.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
